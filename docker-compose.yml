services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: note_taker_mysql
    restart: unless-stopped
    environment:
      # These values will be used to create the MySQL database and user
      # They should match DATABASE_USER, DATABASE_PASSWORD, DATABASE_NAME in app service
      # Note: MYSQL_USER cannot be "root" - use a different username
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DATABASE_NAME:-note_taker_db}
      MYSQL_USER: ${DATABASE_USER:-notetaker}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-notetakerpass}
    ports:
      # Format: HOST_PORT:CONTAINER_PORT
      # Use different host port (3307) to avoid conflict, container still uses 3306
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - note_taker_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: note_taker_redis
    restart: unless-stopped
    ports:
      # Format: HOST_PORT:CONTAINER_PORT
      # Use different host port (6380) to avoid conflict, container still uses 6379
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - note_taker_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  # Node.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: note_taker_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-8080}
      # Database connection variables
      # For Docker: Always use 'mysql' as host (Docker service name for internal networking)
      # Default values (you can override in .env file):
      #   DATABASE_USER=notetaker
      #   DATABASE_PASSWORD=notetakerpass
      #   DATABASE_NAME=note_taker_db
      DATABASE_HOST: mysql
      DATABASE_USER: ${DATABASE_USER:-notetaker}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-notetakerpass}
      DATABASE_NAME: ${DATABASE_NAME:-note_taker_db}
      DATABASE_PORT: 3306
      # DATABASE_URL: Constructed from above variables
      # Default: mysql://notetaker:notetakerpass@mysql:3306/note_taker_db
      # You can override in .env, but make sure to use 'mysql' as host (not 'localhost')
      DATABASE_URL: ${DATABASE_URL:-mysql://notetaker:notetakerpass@mysql:3306/note_taker_db}
      # Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # JWT Secrets
      JWT_ACCESS_KEY_SECRET: ${JWT_ACCESS_KEY_SECRET}
      JWT_REFRESH_KEY_SECRET: ${JWT_REFRESH_KEY_SECRET}
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - note_taker_network
    # Note: Prisma directory is already copied into the image during build
    # No need to mount it as a volume - migrations work with the copied files
    command: sh -c "npx prisma migrate deploy && node build/index.js"

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  note_taker_network:
    driver: bridge

