services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: note_taker_mysql_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-super-strong-root-password}
      MYSQL_DATABASE: ${DATABASE_NAME:-note_taker_db}
      MYSQL_USER: ${DATABASE_USER:-root}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-root}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    networks:
      - note_taker_network_dev
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD:-super-strong-root-password} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: note_taker_redis_dev
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - note_taker_network_dev
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql_data_dev:
    driver: local
  redis_data_dev:
    driver: local

networks:
  note_taker_network_dev:
    driver: bridge
